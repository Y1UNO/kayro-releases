<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hub Widget déplié</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.lg{position:relative;background:linear-gradient(135deg,rgba(255,255,255,0.2),rgba(255,255,255,0.05) 55%,rgba(255,255,255,0.12));backdrop-filter:blur(20px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.06);border:1px solid rgba(255,255,255,0.22);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.55),inset 0 -1.5px 0 rgba(255,255,255,0.12),inset 1.5px 0 0 rgba(255,255,255,0.18),inset -1.5px 0 0 rgba(255,255,255,0.08),0 18px 40px rgba(0,0,0,0.35),0 2px 6px rgba(0,0,0,0.25)}
.lg::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;background:radial-gradient(120% 95% at 18% 0%,rgba(255,255,255,0.3),rgba(255,255,255,0) 46%);pointer-events:none}
</style>
</helmet>
<div style="position:relative;overflow:hidden;width:1280px;height:620px;box-sizing:border-box;background:linear-gradient(135deg,#1a2342 0%,#3a2a55 55%,#5b3a4c 100%);color:#f6efe8;font-family:'DM Sans',system-ui,sans-serif">
  <div style="position:absolute;left:-80px;top:-120px;width:520px;height:420px;border-radius:50%;background:#4b8bff;opacity:0.28;filter:blur(110px)"></div>
  <div style="position:absolute;right:-60px;bottom:-140px;width:560px;height:380px;border-radius:50%;background:#ff7a9a;opacity:0.25;filter:blur(120px)"></div>

  <div style="position:absolute;left:260px;top:24px;width:760px;display:flex;flex-direction:column;gap:12px">

    <div class="lg" style="display:flex;align-items:center;gap:6px;height:62px;box-sizing:border-box;padding:0 12px 0 22px;border-radius:31px;font-size:14px;font-weight:600">
      <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:500;margin-right:14px">Hub</div>
      <span style="padding:9px 14px;border-radius:20px;background:rgba(255,185,138,0.22);color:#ffd2b0">Jeux</span>
      <span style="padding:9px 14px;color:rgba(246,239,232,0.8)">Stream</span>
      <span style="padding:9px 14px;color:rgba(246,239,232,0.8)">Créa</span>
      <span style="padding:9px 14px;color:rgba(246,239,232,0.8)">Logiciels</span>
      <span style="padding:9px 14px;color:rgba(246,239,232,0.8)">Autre</span>
      <div style="flex-grow:1"></div>
      <button aria-label="Replier" style="width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,0.14);color:#f6efe8;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <button aria-label="Commande vocale" style="width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,0.14);color:#f6efe8;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>

    <div class="lg" style="display:flex;flex-direction:column;gap:18px;box-sizing:border-box;padding:22px;border-radius:32px">

      <div style="display:flex;align-items:center;gap:12px;height:46px;box-sizing:border-box;padding:0 16px;border-radius:23px;background:rgba(0,0,0,0.25);box-shadow:inset 0 1px 3px rgba(0,0,0,0.35);color:rgba(246,239,232,0.78);font-size:15px;font-weight:500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span style="flex-grow:1">Rechercher une app ou une scène</span>
        <span style="font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,0.12)">Ctrl + Espace</span>
      </div>

      <div style="display:flex;gap:22px">
        <div style="display:flex;flex-direction:column;gap:10px;width:260px;flex-shrink:0">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;color:rgba(246,239,232,0.7)">SCÈNES</div>
          <button style="display:flex;align-items:center;gap:10px;border:0;border-radius:18px;padding:13px 16px;font-size:15px;font-weight:700;background:#ffb98a;color:#1a1020;text-align:left">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Soirée gaming
          </button>
          <button style="display:flex;align-items:center;gap:10px;border:0;border-radius:18px;padding:13px 16px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.14);color:#f6efe8;text-align:left">Stream</button>
          <button style="display:flex;align-items:center;gap:10px;border:0;border-radius:18px;padding:13px 16px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.14);color:#f6efe8;text-align:left">Créa</button>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;flex-grow:1;min-width:0">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;color:rgba(246,239,232,0.7)">EN COURS</div>
          <sc-for list="{{running}}" as="r" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:12px;height:48px;box-sizing:border-box;padding:0 12px;border-radius:16px;background:rgba(0,0,0,0.22)">
              <div style="width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:17px;font-weight:500;color:#fff;background:linear-gradient(160deg,{{r.c1}},{{r.c2}})">{{r.letter}}</div>
              <div style="flex-grow:1;font-size:15px;font-weight:600">{{r.name}}</div>
              <span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#ffd2b0"><span style="width:8px;height:8px;border-radius:4px;background:#ffd2b0;box-shadow:0 0 8px #ffd2b0"></span>Ouvert</span>
              <button style="border:0;border-radius:14px;padding:7px 12px;font-size:12px;font-weight:700;background:rgba(255,255,255,0.16);color:#f6efe8">Au premier plan</button>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;color:rgba(246,239,232,0.7)">RÉCENTS</div>
        <div style="display:flex;gap:10px">
          <sc-for list="{{recents}}" as="t" hint-placeholder-count="6">
            <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:52px;box-sizing:border-box;padding:0 12px;border-radius:16px;background:rgba(0,0,0,0.22)">
              <div style="width:30px;height:30px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;font-weight:500;color:#fff;background:linear-gradient(160deg,{{t.c1}},{{t.c2}})">{{t.letter}}</div>
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.name}}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      running: [
        { name: 'Discord', letter: 'D', c1: '#b98a9a', c2: '#3a2a3e' },
        { name: 'Steam', letter: 'S', c1: '#b98a9a', c2: '#3a2a3e' },
        { name: 'Spotify', letter: 'S', c1: '#b98a9a', c2: '#3a2a3e' }
      ],
      recents: [
        { name: 'Minecraft', letter: 'M', c1: '#b98a9a', c2: '#3a2a3e' },
        { name: 'OBS Studio', letter: 'O', c1: '#b98a9a', c2: '#3a2a3e' },
        { name: 'Blender', letter: 'B', c1: '#b98a9a', c2: '#3a2a3e' },
        { name: 'VS Code', letter: 'V', c1: '#b98a9a', c2: '#3a2a3e' }
      ]
    };
  }
}
</script>
</body>
</html>
