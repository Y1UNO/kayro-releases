<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kayro widget tour 2</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.gl{position:relative;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(255,255,255,0.2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 26px 64px rgba(0,0,0,0.5)}
.lab{font-size:11px;font-weight:700;letter-spacing:0.18em;color:rgba(244,241,250,0.72)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
.drop{animation:drop .6s cubic-bezier(.2,.9,.2,1) both}
@media (prefers-reduced-motion:reduce){.drop{animation:none}}
</style>
</helmet>
<div style="position:relative;overflow:hidden;width:1280px;height:620px;background:linear-gradient(135deg,#34405E 0%,#5A5274 50%,#7A6670 100%);color:#F4F1FA">
  <div style="position:absolute;left:-120px;bottom:-200px;width:760px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(200,170,220,0.45),rgba(200,170,220,0))"></div>
  <div style="position:absolute;left:24px;bottom:20px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.8)">Bureau Windows (fond d'écran quelconque)</div>

  <div style="position:absolute;left:280px;top:22px;width:720px;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div class="gl" style="display:flex;align-items:center;gap:6px;height:56px;box-sizing:border-box;padding:0 8px 0 10px;border-radius:28px;font-size:14px;font-weight:600;background:{{t.panel}}">
      <div style="width:38px;height:38px;border-radius:19px;background:linear-gradient(160deg,{{t.a}},{{t.b}});display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.2 10 L12 15.5 L9.8 10 Z" fill="#15132B"></path><path d="M4.2 11.5 A7.8 7.8 0 0 0 19.8 11.5 A7.8 5.2 0 0 1 4.2 11.5 Z" fill="#15132B"></path></svg></div>
      <span style="font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:500;margin:0 12px 0 6px">Kayro</span>
      <span style="padding:9px 15px;border-radius:20px;background:rgba(255,255,255,0.16)">Jeux</span>
      <span style="padding:9px 13px;color:rgba(244,241,250,0.8)">Stream</span>
      <span style="padding:9px 13px;color:rgba(244,241,250,0.8)">Créa</span>
      <span style="padding:9px 13px;color:rgba(244,241,250,0.8)">Logiciels</span>
      <span style="padding:9px 13px;color:rgba(244,241,250,0.8)">Autre</span>
      <button aria-label="Replier" style="margin-left:8px;width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,0.12);color:#F4F1FA;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></button>
    </div>

    <div class="gl drop" style="display:flex;flex-direction:column;gap:18px;width:720px;box-sizing:border-box;padding:22px;border-radius:30px;background:{{t.panel}}">
      <div style="display:flex;align-items:center;gap:10px;height:44px;box-sizing:border-box;padding:0 16px;border-radius:22px;background:rgba(0,0,0,0.3);color:rgba(244,241,250,0.75);font-size:15px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="flex-grow:1">Rechercher une app ou une scène</span>
        <span style="font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;background:rgba(255,255,255,0.12)">Ctrl + Alt + H</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="lab">SCÈNES</div>
        <div style="display:flex;gap:10px">
          <button style="display:flex;align-items:center;gap:9px;border:0;border-radius:22px;padding:12px 20px;font-size:15px;font-weight:700;background:linear-gradient(160deg,{{t.a}},{{t.b}});color:#15132B"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>Soirée gaming</button>
          <button style="border:0;border-radius:22px;padding:12px 18px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.1);color:#F4F1FA">Stream</button>
          <button style="border:0;border-radius:22px;padding:12px 18px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.1);color:#F4F1FA">Créa</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="lab">EN COURS</div>
        <div style="display:flex;gap:10px">
          <sc-for list="{{running}}" as="r" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;height:54px;box-sizing:border-box;padding:0 8px;border-radius:27px;background:rgba(0,0,0,0.28)">
              <div style="width:38px;height:38px;flex-shrink:0;border-radius:19px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;background:linear-gradient(160deg,{{r.c}},#0C0A1A)">{{r.l}}</div>
              <div style="display:flex;flex-direction:column;gap:1px;min-width:0;flex-grow:1">
                <div style="font-size:14px;font-weight:600">{{r.n}}</div>
                <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:{{t.soft}}"><span style="width:6px;height:6px;border-radius:3px;background:{{t.a}};box-shadow:0 0 6px {{t.a}}"></span>Ouvert</div>
              </div>
              <button aria-label="Mettre {{r.n}} au premier plan" style="width:34px;height:34px;flex-shrink:0;border-radius:17px;border:0;background:rgba(255,255,255,0.12);color:#F4F1FA;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></button>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="lab">RÉCENTS</div>
        <div style="display:flex;gap:16px">
          <sc-for list="{{recents}}" as="x" hint-placeholder-count="4">
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:84px">
              <div style="width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;background:linear-gradient(160deg,{{x.c}},#0C0A1A);border:1px solid rgba(255,255,255,0.18)">{{x.l}}</div>
              <div style="font-size:12px;font-weight:600;text-align:center;color:rgba(244,241,250,0.85)">{{x.n}}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"lavande-peche","options":["lavande-peche","mauve","sakura","bleu-gris","opale","cuivre"],"section":"Thème"},"$preview":{"width":1280,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {
      'lavande-peche': ['#B7A2F2', '#F6A98A', '#15112B', '#D9CEFA'],
      'mauve': ['#C99ACB', '#9476C2', '#1A1228', '#E6CCE8'],
      'sakura': ['#F7B7C4', '#D9708E', '#24121E', '#FBD8DF'],
      'bleu-gris': ['#A3B0DE', '#7282BC', '#141A30', '#D3DAF2'],
      'opale': ['#9FD0E8', '#F2A2B8', '#10202A', '#D2ECF6'],
      'cuivre': ['#D99A6C', '#B07A78', '#24160F', '#F0D2BC']
    };
    const v = TH[this.props.theme] || TH['lavande-peche'];
    const hexA = (h, a) => 'rgba(' + [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(',') + ',' + a + ')';
    const t = { a: v[0], b: v[1], soft: v[3], panel: 'linear-gradient(160deg,' + hexA(v[2], 0.82) + ',' + hexA(v[2], 0.72) + ')' };
    return {
      t,
      running: [ { n: 'Discord', l: 'D', c: '#5865F2' }, { n: 'Steam', l: 'S', c: '#3F6B9A' }, { n: 'Spotify', l: 'S', c: '#2E8A5A' } ],
      recents: [ { n: 'Hades II', l: 'H', c: v[0] }, { n: 'OBS Studio', l: 'O', c: '#6A6A8A' }, { n: 'Blender', l: 'B', c: '#E87D0D' }, { n: 'DaVinci', l: 'D', c: '#4A7AC9' } ]
    };
  }
}
</script>
</body>
</html>
