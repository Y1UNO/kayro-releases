<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kayro ouverture</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
@keyframes glowIn{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
@keyframes slideL{from{transform:translateX(150px)}to{transform:translateX(0)}}
@keyframes blade{from{opacity:0;transform:translateY(-26px)}to{opacity:1;transform:none}}
@keyframes cres{from{opacity:0;transform:rotate(-70deg)}to{opacity:1;transform:none}}
@keyframes glint{from{transform:translateX(-170px) skewX(-20deg)}to{transform:translateX(210px) skewX(-20deg)}}
@keyframes nameIn{from{transform:translateX(-105%)}to{transform:none}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1)}}
.glow{animation:glowIn 1.1s ease-out both}
.slide{animation:slideL .8s cubic-bezier(.65,0,.35,1) 1.5s both}
.pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1) .2s both}
.blade{transform-box:fill-box;transform-origin:center;animation:blade .55s cubic-bezier(.22,1,.36,1) .6s both}
.cres{transform-box:fill-box;transform-origin:center;animation:cres .7s cubic-bezier(.22,1,.36,1) .45s both}
.glint{animation:glint .9s ease-in-out 1.05s both}
.name{animation:nameIn .9s cubic-bezier(.22,1,.36,1) 1.75s both}
.line{transform-origin:left;animation:line .7s cubic-bezier(.65,0,.35,1) 2.3s both}
.sub{animation:fadeUp .6s ease 2.55s both}
.bgfx{animation:bgIn 1.6s ease 2.6s both}
.star{animation:tw 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.glow,.slide,.pop,.blade,.cres,.glint,.name,.line,.sub,.bgfx{animation-duration:.01s;animation-delay:0s}.star{animation:none}}
</style>
</helmet>
<div style="position:relative;overflow:hidden;width:1280px;height:760px;background:{{t.bg}};color:#F4F1FA">

  <sc-if value="{{even}}" hint-placeholder-val="{{true}}">
    <div style="position:absolute;left:0;top:0;width:1280px;height:760px">
      <div class="bgfx" style="position:absolute;left:0;top:0;width:1280px;height:760px">
        <div style="position:absolute;left:500px;top:0;width:280px;height:600px;background:linear-gradient(180deg,{{t.beam}},rgba(0,0,0,0) 80%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent)"></div>
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="20">
          <div class="star" style="position:absolute;left:{{s.x}}px;top:{{s.y}}px;width:{{s.r}}px;height:{{s.r}}px;border-radius:50%;background:#F4F1FA;animation-delay:{{s.d}}s"></div>
        </sc-for>
      </div>
      <div class="glow" style="position:absolute;left:340px;top:130px;width:600px;height:460px;border-radius:50%;background:radial-gradient(closest-side,{{t.glow}},rgba(0,0,0,0))"></div>
      <div style="position:absolute;left:0;top:250px;width:1280px;display:flex;justify-content:center">
        <div style="display:flex;align-items:center;gap:30px">
          <div class="slide" style="position:relative;z-index:2">
            <div class="pop" style="position:relative;overflow:hidden;width:132px;height:132px;border-radius:34px;background:linear-gradient(160deg,{{t.a}},{{t.b}});box-shadow:0 30px 80px {{t.glow}},inset 0 1px 0 rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center">
              <svg width="92" height="92" viewBox="0 0 24 24" aria-hidden="true"><path class="blade" d="M12 2 L14.2 10 L12 15.5 L9.8 10 Z" fill="#15132B"></path><path class="cres" d="M4.2 11.5 A7.8 7.8 0 0 0 19.8 11.5 A7.8 5.2 0 0 1 4.2 11.5 Z" fill="#15132B"></path></svg>
              <div class="glint" style="position:absolute;left:0;top:-20px;width:46px;height:180px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.55),rgba(255,255,255,0))"></div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="overflow:hidden">
              <div class="name" style="font-family:'Cormorant Garamond',serif;font-size:118px;line-height:1;font-weight:300;letter-spacing:-0.01em">Kayro</div>
            </div>
            <div class="line" style="height:2px;width:100%;background:linear-gradient(90deg,{{t.a}},{{t.b}})"></div>
            <div class="sub" style="font-size:12px;font-weight:700;letter-spacing:0.32em;color:{{t.soft}}">LANCEUR D'APPLICATIONS</div>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{odd}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:0;top:0;width:1280px;height:760px">
      <div class="bgfx" style="position:absolute;left:0;top:0;width:1280px;height:760px">
        <div style="position:absolute;left:500px;top:0;width:280px;height:600px;background:linear-gradient(180deg,{{t.beam}},rgba(0,0,0,0) 80%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent)"></div>
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="20">
          <div class="star" style="position:absolute;left:{{s.x}}px;top:{{s.y}}px;width:{{s.r}}px;height:{{s.r}}px;border-radius:50%;background:#F4F1FA;animation-delay:{{s.d}}s"></div>
        </sc-for>
      </div>
      <div class="glow" style="position:absolute;left:340px;top:130px;width:600px;height:460px;border-radius:50%;background:radial-gradient(closest-side,{{t.glow}},rgba(0,0,0,0))"></div>
      <div style="position:absolute;left:0;top:250px;width:1280px;display:flex;justify-content:center">
        <div style="display:flex;align-items:center;gap:30px">
          <div class="slide" style="position:relative;z-index:2">
            <div class="pop" style="position:relative;overflow:hidden;width:132px;height:132px;border-radius:34px;background:linear-gradient(160deg,{{t.a}},{{t.b}});box-shadow:0 30px 80px {{t.glow}},inset 0 1px 0 rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center">
              <svg width="92" height="92" viewBox="0 0 24 24" aria-hidden="true"><path class="blade" d="M12 2 L14.2 10 L12 15.5 L9.8 10 Z" fill="#15132B"></path><path class="cres" d="M4.2 11.5 A7.8 7.8 0 0 0 19.8 11.5 A7.8 5.2 0 0 1 4.2 11.5 Z" fill="#15132B"></path></svg>
              <div class="glint" style="position:absolute;left:0;top:-20px;width:46px;height:180px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.55),rgba(255,255,255,0))"></div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="overflow:hidden">
              <div class="name" style="font-family:'Cormorant Garamond',serif;font-size:118px;line-height:1;font-weight:300;letter-spacing:-0.01em">Kayro</div>
            </div>
            <div class="line" style="height:2px;width:100%;background:linear-gradient(90deg,{{t.a}},{{t.b}})"></div>
            <div class="sub" style="font-size:12px;font-weight:700;letter-spacing:0.32em;color:{{t.soft}}">LANCEUR D'APPLICATIONS</div>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="position:absolute;left:0;bottom:36px;width:1280px;display:flex;justify-content:center">
    <div style="display:flex;align-items:center;gap:14px;padding:8px 10px 8px 8px;border-radius:18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14)">
      <button onClick="{{replay}}" style="display:flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:700;background:linear-gradient(160deg,{{t.a}},{{t.b}});color:#15132B"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg>Rejouer</button>
      <span style="font-size:13px;color:rgba(244,241,250,0.75)">Thème :</span>
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.on}}" style="width:30px;height:30px;border-radius:10px;border:2px solid {{c.ring}};background:linear-gradient(160deg,{{c.a}},{{c.b}})"></button>
      </sc-for>
      <span style="font-size:12px;color:rgba(244,241,250,0.7)">≈ 3 s, puis l'interface apparaît</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"lavande-peche","options":["lavande-peche","mauve","sakura","bleu-gris","opale","cuivre"],"section":"Thème"},"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {
      'lavande-peche': ['Lavande et pêche', '#B7A2F2', '#F6A98A', '#15112B', '#0C0A1A', '#06050D', '#D9CEFA'],
      'mauve': ['Mauve poudré', '#C99ACB', '#9476C2', '#1A1228', '#100B1A', '#08060D', '#E6CCE8'],
      'sakura': ['Sakura', '#F7B7C4', '#D9708E', '#24121E', '#150A12', '#0B0509', '#FBD8DF'],
      'bleu-gris': ['Bleu-gris sobre', '#A3B0DE', '#7282BC', '#141A30', '#0B0F1E', '#05070F', '#D3DAF2'],
      'opale': ['Opale', '#9FD0E8', '#F2A2B8', '#10202A', '#0A131A', '#05090D', '#D2ECF6'],
      'cuivre': ['Cuivre', '#D99A6C', '#B07A78', '#24160F', '#150D09', '#0A0605', '#F0D2BC']
    };
    const st = this.state || {};
    const key = st.th || this.props.theme || 'lavande-peche';
    const v = TH[key] || TH['lavande-peche'];
    const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' + parseInt(h.slice(5, 7), 16) + ',' + a + ')';
    const t = {
      a: v[1], b: v[2], soft: v[6],
      bg: 'radial-gradient(90% 75% at 50% 0%,' + v[3] + ' 0%,' + v[4] + ' 50%,' + v[5] + ' 100%)',
      glow: hexA(v[1], 0.32), beam: hexA(v[1], 0.22)
    };
    const run = st.run || 0;
    const stars = [];
    for (let i = 0; i < 20; i++) {
      const a = Math.abs(Math.sin(i * 12.99) * 43758.5) % 1, b = Math.abs(Math.sin(i * 78.23) * 12543.1) % 1;
      stars.push({ x: Math.round(20 + a * 1240), y: Math.round(30 + b * 640), r: (1.2 + (a * 7 % 1) * 1.6).toFixed(1), d: (-(b * 6)).toFixed(1) });
    }
    const chips = Object.keys(TH).map((k) => ({
      label: 'Thème ' + TH[k][0], a: TH[k][1], b: TH[k][2], on: k === key ? 'true' : 'false',
      ring: k === key ? '#F4F1FA' : 'rgba(255,255,255,0.15)',
      pick: () => this.setState({ th: k, run: (this.state && this.state.run || 0) + 1 })
    }));
    return { t, stars, chips, even: run % 2 === 0, odd: run % 2 === 1, replay: () => this.setState({ run: run + 1 }) };
  }
}
</script>
</body>
</html>
