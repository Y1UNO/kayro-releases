<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kayro thèmes du logo</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
</style>
</helmet>
<div style="position:relative;overflow:hidden;width:1280px;height:760px;box-sizing:border-box;padding:40px 48px;background:#08070E;color:#F4F1FA;display:flex;flex-direction:column;gap:22px">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.22em;color:rgba(244,241,250,0.72)">PERSONNALISATION</div>
      <h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-size:56px;line-height:1;font-weight:300">Un thème par couleur du logo</h1>
    </div>
    <p style="margin:0;max-width:420px;font-size:14px;line-height:1.5;color:rgba(244,241,250,0.78)">Choisir la couleur du logo choisit tout le thème : accents, lumière, boutons. Ensuite, l'affiche du jeu nuance la lumière (étape 14).</p>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;flex-grow:1;min-height:0">
    <sc-for list="{{themes}}" as="t" hint-placeholder-count="6">
      <div style="position:relative;overflow:hidden;border-radius:20px;border:1px solid rgba(255,255,255,0.12);background:{{t.bg}};display:flex;flex-direction:column;padding:16px;box-sizing:border-box;gap:10px">
        <div style="position:absolute;left:120px;top:0;width:150px;height:240px;background:linear-gradient(180deg,{{t.beam}},rgba(0,0,0,0) 80%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent)"></div>
        <div style="position:relative;display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:30px;height:30px;border-radius:9px;background:linear-gradient(160deg,{{t.a}},{{t.b}});display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.2 10 L12 15.5 L9.8 10 Z" fill="#15132B"></path><path d="M4.2 11.5 A7.8 7.8 0 0 0 19.8 11.5 A7.8 5.2 0 0 1 4.2 11.5 Z" fill="#15132B"></path></svg></div>
            <span style="font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:500">Kayro</span>
          </div>
          <span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,0.35);color:{{t.soft}}">{{t.id}}</span>
        </div>
        <div style="position:relative;text-align:center;font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;line-height:1">Jeux</div>
        <div style="position:relative;display:flex;align-items:flex-end;justify-content:center;gap:8px;flex-grow:1">
          <div style="width:52px;height:74px;border-radius:10px;opacity:.6;background:linear-gradient(170deg,{{t.c1}},{{t.c2}});border:1px solid rgba(255,255,255,0.16)"></div>
          <div style="width:70px;height:98px;border-radius:12px;background:linear-gradient(170deg,{{t.c1}},{{t.c2}});border:1px solid rgba(255,255,255,0.5);box-shadow:0 10px 30px {{t.glow}}"></div>
          <div style="width:52px;height:74px;border-radius:10px;opacity:.6;background:linear-gradient(170deg,{{t.c1}},{{t.c2}});border:1px solid rgba(255,255,255,0.16)"></div>
        </div>
        <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div style="display:flex;flex-direction:column;gap:1px">
            <div style="font-size:15px;font-weight:700">{{t.name}}</div>
            <div style="font-size:11px;color:rgba(244,241,250,0.72)">{{t.hex}}</div>
          </div>
          <span style="padding:8px 14px;border-radius:11px;font-size:12px;font-weight:700;background:linear-gradient(160deg,{{t.a}},{{t.b}});color:#15132B">Soirée gaming</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const L = [
      ['7a', 'Lavande et pêche', '#B7A2F2', '#F6A98A', '#15112B', '#0C0A1A', '#06050D', '#D9CEFA'],
      ['7e', 'Mauve poudré', '#C99ACB', '#9476C2', '#1A1228', '#100B1A', '#08060D', '#E6CCE8'],
      ['7f', 'Sakura', '#F7B7C4', '#D9708E', '#24121E', '#150A12', '#0B0509', '#FBD8DF'],
      ['7h', 'Bleu-gris sobre', '#A3B0DE', '#7282BC', '#141A30', '#0B0F1E', '#05070F', '#D3DAF2'],
      ['7i', 'Opale', '#9FD0E8', '#F2A2B8', '#10202A', '#0A131A', '#05090D', '#D2ECF6'],
      ['7j', 'Cuivre', '#D99A6C', '#B07A78', '#24160F', '#150D09', '#0A0605', '#F0D2BC']
    ];
    const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const hexA = (h, a) => 'rgba(' + rgb(h).join(',') + ',' + a + ')';
    const dark = (h, k) => 'rgb(' + rgb(h).map((c) => Math.round(c * k)).join(',') + ')';
    return {
      themes: L.map((v) => ({
        id: v[0], name: v[1], a: v[2], b: v[3], soft: v[7], hex: v[2] + ' · ' + v[3],
        bg: 'radial-gradient(90% 80% at 50% 0%,' + v[4] + ' 0%,' + v[5] + ' 55%,' + v[6] + ' 100%)',
        beam: hexA(v[2], 0.24), glow: hexA(v[2], 0.35), c1: v[2], c2: dark(v[3], 0.22)
      }))
    };
  }
}
</script>
</body>
</html>
