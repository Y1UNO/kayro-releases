<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kayro ouverture V1-A</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes haloIn{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1257}to{stroke-dashoffset:0}}
@keyframes ringOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
@keyframes glintSpin{0%{opacity:0;transform:rotate(0deg)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:rotate(360deg)}}
@keyframes logoIn{from{opacity:0;filter:blur(14px);transform:scale(.86)}to{opacity:1;filter:blur(0);transform:scale(1)}}
@keyframes slideL{from{transform:translateX(150px)}to{transform:translateX(0)}}
@keyframes sheen{from{transform:translateX(-170px) skewX(-20deg)}to{transform:translateX(210px) skewX(-20deg)}}
@keyframes lA0{0%{opacity:0;filter:blur(6px);transform:translateX(-127px) scale(.45)}30%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}@keyframes lA1{0%{opacity:0;filter:blur(6px);transform:translateX(-183px) scale(.45)}30%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}@keyframes lA2{0%{opacity:0;filter:blur(6px);transform:translateX(-234px) scale(.45)}30%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}@keyframes lA3{0%{opacity:0;filter:blur(6px);transform:translateX(-279px) scale(.45)}30%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}@keyframes lA4{0%{opacity:0;filter:blur(6px);transform:translateX(-326px) scale(.45)}30%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{0%{opacity:0;transform:translateY(0)}18%{opacity:.85}100%{opacity:0;transform:translateY(-320px)}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1)}}
.bg{animation:bgIn calc(var(--k,1)*.7s) ease both}
.halo{animation:haloIn calc(var(--k,1)*1.4s) cubic-bezier(.22,1,.36,1) calc(var(--k,1)*.1s) both}
.ringwrap{animation:ringOut calc(var(--k,1)*.85s) cubic-bezier(.4,0,.2,1) calc(var(--k,1)*1.75s) both}
.draw{stroke-dasharray:1257;animation:draw calc(var(--k,1)*1.1s) cubic-bezier(.65,0,.35,1) calc(var(--k,1)*.2s) both}
.glint{animation:glintSpin calc(var(--k,1)*1.05s) cubic-bezier(.45,0,.25,1) calc(var(--k,1)*.95s) both}
.slide{animation:slideL calc(var(--k,1)*.65s) cubic-bezier(.22,1,.36,1) calc(var(--k,1)*1.75s) both}
.logo{animation:logoIn calc(var(--k,1)*.8s) cubic-bezier(.22,1,.36,1) calc(var(--k,1)*.95s) both}
.sheen{animation:sheen calc(var(--k,1)*.9s) ease-in-out calc(var(--k,1)*1.45s) both}
.lt{display:inline-block;animation-duration:calc(var(--k,1)*.8s);animation-timing-function:cubic-bezier(.16,1,.3,1);animation-fill-mode:both}.lA0{animation-name:lA0}.lA1{animation-name:lA1}.lA2{animation-name:lA2}.lA3{animation-name:lA3}.lA4{animation-name:lA4}
.line{transform-origin:left;animation:line calc(var(--k,1)*.7s) cubic-bezier(.65,0,.35,1) calc(var(--k,1)*2.55s) both}
.sub{animation:fadeUp calc(var(--k,1)*.6s) ease calc(var(--k,1)*2.8s) both}
.ember{animation:rise 5.5s ease-out infinite both}
.star{animation:tw 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bg,.halo,.ringwrap,.draw,.glint,.slide,.logo,.sheen,.lt,.lbox,.line,.sub{animation-duration:.01s !important;animation-delay:0s !important}.ember,.star{animation:none}}
</style>
</helmet>
<div style="position:relative;overflow:hidden;width:1280px;height:760px;background:#05070F;color:#F4F1FA;--k:{{k}}">

  <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
    <div style="position:absolute;left:0;top:0;width:1280px;height:760px">
      <div class="bg" style="position:absolute;left:0;top:0;width:1280px;height:760px;background:{{t.bg}}">
        <div style="position:absolute;left:500px;top:0;width:280px;height:600px;background:linear-gradient(180deg,{{t.beam}},rgba(0,0,0,0) 80%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent)"></div>
        <sc-for list="{{stars}}" as="s" hint-placeholder-count="22">
          <div class="star" style="position:absolute;left:{{s.x}}px;top:{{s.y}}px;width:{{s.r}}px;height:{{s.r}}px;border-radius:50%;background:#F4F1FA;animation-delay:{{s.d}}s"></div>
        </sc-for>
      </div>

      <div class="halo" style="position:absolute;left:300px;top:57px;width:680px;height:540px;border-radius:50%;background:radial-gradient(closest-side,{{t.glow}},rgba(0,0,0,0))"></div>

      <div class="ringwrap" style="position:absolute;left:420px;top:107px;width:440px;height:440px">
        <svg width="440" height="440" viewBox="0 0 440 440" aria-hidden="true" style="position:absolute;left:0;top:0;overflow:visible">
          <circle class="draw" pathLength="1257" cx="220" cy="220" r="200" fill="none" stroke="{{t.ringA}}" stroke-width="1.6" transform="rotate(-90 220 220)"></circle>
          <circle class="draw" pathLength="1257" cx="220" cy="220" r="196" fill="none" stroke="{{t.ringB}}" stroke-width="1" transform="rotate(-90 220 220)"></circle>
          <circle class="draw" pathLength="1257" cx="220" cy="220" r="203" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="0.8" transform="rotate(-90 220 220)"></circle>
        </svg>
        <div class="glint" style="position:absolute;left:0;top:0;width:440px;height:440px">
          <svg width="440" height="440" viewBox="0 0 440 440" aria-hidden="true" style="position:absolute;left:0;top:0;overflow:visible">
            <circle cx="220" cy="220" r="200" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="70 1187" transform="rotate(-90 220 220)" style="filter:drop-shadow(0 0 6px rgba(255,255,255,0.9))"></circle>
          </svg>
        </div>
      </div>

      <div style="position:absolute;left:0;top:250px;width:1280px;display:flex;justify-content:center">
        <div style="display:flex;align-items:center;gap:30px">
          <div class="slide" style="position:relative;z-index:2">
            <div class="logo" style="position:relative;overflow:hidden;width:132px;height:132px;border-radius:34px;background:linear-gradient(160deg,{{t.a}},{{t.b}});box-shadow:0 30px 80px {{t.glow}},inset 0 1px 0 rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center">
              <svg width="92" height="92" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L14.2 10 L12 15.5 L9.8 10 Z" fill="#15132B"></path><path d="M4.2 11.5 A7.8 7.8 0 0 0 19.8 11.5 A7.8 5.2 0 0 1 4.2 11.5 Z" fill="#15132B"></path></svg>
              <div class="sheen" style="position:absolute;left:0;top:-20px;width:46px;height:180px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.55),rgba(255,255,255,0))"></div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;font-family:'Cormorant Garamond',serif;font-size:118px;line-height:1;font-weight:300"><sc-for list="{{letters}}" as="l" hint-placeholder-count="5"><span class="lt {{l.cls}}" style="animation-delay:calc(var(--k,1) * {{l.d}}s)">{{l.c}}</span></sc-for></div>
            <div class="line" style="height:2px;width:100%;background:linear-gradient(90deg,{{t.a}},{{t.b}})"></div>
            <div class="sub" style="font-size:12px;font-weight:700;letter-spacing:0.32em;color:{{t.soft}}">LANCEUR D'APPLICATIONS</div>
          </div>
        </div>
      </div>

      <sc-for list="{{embers}}" as="e" hint-placeholder-count="14">
        <div class="ember" style="position:absolute;left:{{e.x}}px;top:{{e.y}}px;width:{{e.r}}px;height:{{e.r}}px;border-radius:50%;background:{{t.ember}};box-shadow:0 0 10px {{t.ember}};animation-delay:calc(var(--k,1) * {{e.d}}s);animation-duration:{{e.dur}}s"></div>
      </sc-for>
    </div>
  </sc-if>

  <div style="position:absolute;left:0;bottom:30px;width:1280px;display:flex;justify-content:center">
    <div style="display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14)">
      <button onClick="{{replay}}" style="display:flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:700;background:linear-gradient(160deg,{{t.a}},{{t.b}});color:#15132B"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg>Rejouer</button>
      <button onClick="{{toggleLoop}}" aria-pressed="{{loopOn}}" style="border:1px solid {{loopRing}};border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;background:rgba(255,255,255,0.06);color:#F4F1FA">{{loopLabel}}</button>
      <span style="font-size:13px;color:rgba(244,241,250,0.75)">Thème :</span>
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.on}}" style="width:30px;height:30px;border-radius:10px;border:2px solid {{c.ring}};background:linear-gradient(160deg,{{c.a}},{{c.b}})"></button>
      </sc-for>
      <span style="font-size:12px;color:rgba(244,241,250,0.72)">{{durLabel}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"bleu-gris","options":["lavande-peche","mauve","sakura","bleu-gris","opale","cuivre"],"section":"Thème"},"vitesse":{"editor":"enum","default":"normale","options":["lente","normale","rapide"],"section":"Animation"},"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  componentWillUnmount() { if (this._iv) clearInterval(this._iv); }
  renderVals() {
    const TH = {
      'lavande-peche': ['Lavande et pêche', '#B7A2F2', '#F6A98A', '#15112B', '#0C0A1A', '#06050D', '#D9CEFA'],
      'mauve': ['Mauve poudré', '#C99ACB', '#9476C2', '#1A1228', '#100B1A', '#08060D', '#E6CCE8'],
      'sakura': ['Sakura', '#F7B7C4', '#D9708E', '#24121E', '#150A12', '#0B0509', '#FBD8DF'],
      'bleu-gris': ['Bleu-gris sobre', '#A3B0DE', '#7282BC', '#141A30', '#0B0F1E', '#05070F', '#D3DAF2'],
      'opale': ['Opale', '#9FD0E8', '#F2A2B8', '#10202A', '#0A131A', '#05090D', '#D2ECF6'],
      'cuivre': ['Cuivre', '#D99A6C', '#B07A78', '#24160F', '#150D09', '#0A0605', '#F0D2BC']
    };
    const st = this.state || {};
    const key = st.th || this.props.theme || 'bleu-gris';
    const v = TH[key] || TH['bleu-gris'];
    const K = { lente: 1.5, normale: 1, rapide: 0.7 };
    const k = K[this.props.vitesse] || 1;
    const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' + parseInt(h.slice(5, 7), 16) + ',' + a + ')';
    const t = {
      a: v[1], b: v[2], soft: v[6],
      bg: 'radial-gradient(90% 75% at 50% 0%,' + v[3] + ' 0%,' + v[4] + ' 50%,' + v[5] + ' 100%)',
      glow: hexA(v[1], 0.3), beam: hexA(v[1], 0.2),
      ringA: hexA(v[1], 0.9), ringB: hexA(v[2], 0.7), ember: hexA(v[2], 0.95)
    };
    const stars = [];
    for (let i = 0; i < 22; i++) {
      const a = Math.abs(Math.sin(i * 12.99) * 43758.5) % 1, b = Math.abs(Math.sin(i * 78.23) * 12543.1) % 1;
      stars.push({ x: Math.round(20 + a * 1240), y: Math.round(30 + b * 600), r: (1.2 + (a * 7 % 1) * 1.6).toFixed(1), d: (-(b * 6)).toFixed(1) });
    }
    const embers = [];
    for (let i = 0; i < 14; i++) {
      const a = Math.abs(Math.sin(i * 31.7) * 9631.3) % 1, b = Math.abs(Math.sin(i * 5.13) * 7731.9) % 1;
      embers.push({ x: Math.round(360 + a * 560), y: Math.round(560 + b * 130), r: (2 + b * 2.5).toFixed(1), d: (2.5 + i * 0.32).toFixed(2), dur: (4.5 + a * 2.5).toFixed(1) });
    }
    const letters = 'Kayro'.split('').map((c, i) => ({ c, cls: 'lA' + i, d: (2.0 + i * 0.085).toFixed(3) }));
    const restart = () => { this.setState({ playing: false }); setTimeout(() => this.setState({ playing: true }), 60); };
    const chips = Object.keys(TH).map((kk) => ({
      label: 'Thème ' + TH[kk][0], a: TH[kk][1], b: TH[kk][2], on: kk === key ? 'true' : 'false',
      ring: kk === key ? '#F4F1FA' : 'rgba(255,255,255,0.15)',
      pick: () => { this.setState({ th: kk }); restart(); }
    }));
    const loopOn = !!st.loop;
    const toggleLoop = () => {
      if (this._iv) { clearInterval(this._iv); this._iv = null; this.setState({ loop: false }); return; }
      this._iv = setInterval(restart, Math.round(k * 5000));
      this.setState({ loop: true });
      restart();
    };
    return {
      t, k, stars, embers, letters, chips,
      playing: st.playing !== false,
      replay: restart, toggleLoop, loopOn: loopOn ? 'true' : 'false',
      loopLabel: loopOn ? 'Boucle : oui' : 'Boucle : non',
      loopRing: loopOn ? '#F4F1FA' : 'rgba(255,255,255,0.18)',
      durLabel: '≈ ' + (3.4 * k).toFixed(1).replace('.', ',') + ' s'
    };
  }
}
</script>
</body>
</html>
