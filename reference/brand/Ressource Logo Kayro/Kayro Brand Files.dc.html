<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E5EF;}a{color:#4B3A9E;text-decoration:none;}a:hover{color:#E0706F;}</style>
</helmet>
<div style="padding:64px 64px 96px;display:flex;flex-direction:column;gap:40px;font-family:'JetBrains Mono',monospace;color:#221D45;">
<div style="display:flex;flex-direction:column;gap:8px;">
<div style="font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.7;">reference/brand/ · aperçus 16 · 32 · 256 px</div>
<div style="font-family:Fraunces,serif;font-weight:300;font-size:44px;">Kayro — fichiers de marque</div>
</div>
<sc-for list="{{ files }}" as="f" hint-placeholder-count="5">
<div style="display:flex;flex-direction:column;gap:12px;">
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;"><a href="{{ f.src }}" style="font-size:14px;">{{ f.name }}</a><span style="font-size:12px;opacity:.75;">{{ f.note }}</span></div>
<div style="display:flex;flex-wrap:wrap;gap:16px;">
<div style="flex:1 1 420px;min-width:0;border-radius:16px;background:#F7F6FA;padding:24px;display:flex;align-items:flex-end;gap:28px;">
<sc-for list="{{ f.cells }}" as="c" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;color:#5A5478;"><img src="{{ c.src }}" width="{{ c.w }}" height="{{ c.w }}" alt=""></img>{{ c.w }}</div></sc-for>
</div>
<div style="flex:1 1 420px;min-width:0;border-radius:16px;background:#15132B;padding:24px;display:flex;align-items:flex-end;gap:28px;">
<sc-for list="{{ f.cells }}" as="c" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px;color:#B9B3D6;"><img src="{{ c.src }}" width="{{ c.w }}" height="{{ c.w }}" alt=""></img>{{ c.w }}</div></sc-for>
</div>
</div>
</div>
</sc-for>
<div style="display:flex;flex-direction:column;gap:12px;">
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;"><a href="reference/brand/variantes.json" style="font-size:14px;">variantes.json</a><span style="font-size:12px;opacity:.75;">6 variantes de symbole.svg · défaut 7a</span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;">
<sc-for list="{{ variants }}" as="v" hint-placeholder-count="6">
<div style="border-radius:16px;background:#F7F6FA;padding:20px;display:flex;flex-direction:column;gap:14px;">
<div style="font-size:12px;"><span style="background:#221D45;color:#fff;padding:3px 8px;border-radius:4px;">{{ v.id }}</span> {{ v.nom }}</div>
<div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;">
<img src="{{ v.src }}" width="96" height="96" alt=""></img>
<img src="{{ v.src }}" width="32" height="32" alt=""></img>
<img src="{{ v.src }}" width="16" height="16" alt=""></img>
<div style="background:#15132B;border-radius:8px;padding:8px;display:flex;align-items:flex-end;gap:8px;"><img src="{{ v.src }}" width="32" height="32" alt=""></img><img src="{{ v.src }}" width="16" height="16" alt=""></img></div>
</div>
<div style="font-size:11px;line-height:1.7;color:#5A5478;">haut {{ v.haut }} · bas {{ v.bas }} · symbole {{ v.symbole }}</div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const B = 'reference/brand/';
    const mk = (name, note, src) => ({ name, note, src: src || B + name, cells: [16, 32, 256].map(w => ({ w, src: src || B + name })) });
    const V = [
      ['7a','Lavande et pêche','#B7A2F2','#F6A98A','#15132B · 8,2:1'],['7e','Mauve poudré','#C99ACB','#9476C2','#15132B · 4,9:1'],
      ['7f','Sakura','#F7B7C4','#D9708E','#15132B · 5,7:1'],['7h','Bleu-gris sobre','#A3B0DE','#7282BC','#15132B · 4,9:1'],
      ['7i','Opale','#9FD0E8','#F2A2B8','#15132B · 9,2:1'],['7j','Cuivre','#D99A6C','#B07A78','#15132B · 5,1:1']];
    return {
      files: [
        mk('symbole.svg', 'A · couleur pilotable (--logo-top / --logo-bottom / --logo-glyph), ici défaut 7a'),
        mk('icone-app.svg', 'B · icône neutre .exe / raccourci / installeur · fond #0B1026, symbole cristal #F4F8FF'),
        mk('icone-app-1024.png', 'B · PNG 1024 de l’icône neutre'),
        mk('icone-app-petit.svg', 'B · version 16–48 px, trait épais, sans dégradé'),
        mk('tray-blanc.svg', 'C · barre système, thème sombre'),
        mk('tray-noir.svg', 'C · barre système, thème clair')
      ],
      variants: V.map(([id, nom, haut, bas, symbole]) => ({ id, nom, haut, bas, symbole, src: 'apercu/variantes/' + id + '.svg' }))
    };
  }
}
</script>
</body>
</html>
