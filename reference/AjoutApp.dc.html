<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hub Ajouter des applications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.lg{position:relative;background:linear-gradient(135deg,rgba(255,255,255,0.2),rgba(255,255,255,0.05) 55%,rgba(255,255,255,0.12));backdrop-filter:blur(20px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.06);border:1px solid rgba(255,255,255,0.22);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.55),inset 0 -1.5px 0 rgba(255,255,255,0.12),inset 1.5px 0 0 rgba(255,255,255,0.18),inset -1.5px 0 0 rgba(255,255,255,0.08),0 18px 40px rgba(0,0,0,0.35),0 2px 6px rgba(0,0,0,0.25)}
.lg::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;background:radial-gradient(120% 95% at 18% 0%,rgba(255,255,255,0.3),rgba(255,255,255,0) 46%);pointer-events:none}
@keyframes fogA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(200px,-40px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
.fogA{animation:fogA 26s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fogA{animation:none}}
</style>
</helmet>
<div style="position:relative;overflow:hidden;width:1280px;height:760px;box-sizing:border-box;background:linear-gradient(180deg,#171021 0%,#0f0a16 55%,#09060d 100%);color:#f6efe8;font-family:'DM Sans',system-ui,sans-serif">
  <div class="fogA" style="position:absolute;left:-200px;top:320px;width:1000px;height:420px;border-radius:50%;background:rgba(160,104,214,0.4);filter:blur(100px)"></div>
  <div style="position:absolute;right:-240px;top:-60px;width:900px;height:420px;border-radius:50%;background:rgba(255,150,100,0.26);filter:blur(110px)"></div>

  <div style="position:absolute;left:56px;top:56px;right:56px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;opacity:0.45">
    <sc-for list="{{ghosts}}" as="g" hint-placeholder-count="5">
      <div style="height:300px;border-radius:26px;background:linear-gradient(170deg,{{g.c1}},{{g.c2}});border:1px solid rgba(255,255,255,0.18)"></div>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;top:0;width:1280px;height:760px;background:rgba(8,5,12,0.62)"></div>

  <svg width="1280" height="760" viewBox="0 0 1280 760" style="position:absolute;left:0;top:0;opacity:0.1;mix-blend-mode:overlay;pointer-events:none" aria-hidden="true">
    <filter id="grainI"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="1280" height="760" filter="url(#grainI)"/>
  </svg>

  <div class="lg" style="position:absolute;left:260px;top:60px;width:760px;height:640px;box-sizing:border-box;padding:30px 34px;border-radius:36px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-family:'Fraunces',serif;font-size:32px;font-weight:500;letter-spacing:-0.01em">Ajouter des applications</div>
      <button aria-label="Fermer" style="width:38px;height:38px;border-radius:19px;border:0;background:rgba(255,255,255,0.14);color:#f6efe8;display:flex;align-items:center;justify-content:center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div style="display:flex;padding:4px;border-radius:22px;background:rgba(0,0,0,0.25);align-self:flex-start;font-size:14px;font-weight:600">
      <span style="padding:9px 18px;border-radius:18px;background:rgba(255,255,255,0.2)">Détectées</span>
      <span style="padding:9px 18px;color:rgba(246,239,232,0.75)">Glisser-déposer</span>
      <span style="padding:9px 18px;color:rgba(246,239,232,0.75)">Manuel</span>
    </div>

    <div style="display:flex;gap:8px;font-size:13px;font-weight:600">
      <span style="padding:6px 12px;border-radius:14px;background:rgba(255,185,138,0.24);color:#ffd2b0">Tout · [n]</span>
      <span style="padding:6px 12px;border-radius:14px;background:rgba(255,255,255,0.1)">Steam · [n]</span>
      <span style="padding:6px 12px;border-radius:14px;background:rgba(255,255,255,0.1)">Epic · [n]</span>
      <span style="padding:6px 12px;border-radius:14px;background:rgba(255,255,255,0.1)">Menu Démarrer · [n]</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;flex-grow:1;min-height:0">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:14px;height:52px;box-sizing:border-box;padding:0 14px;border-radius:16px;background:rgba(0,0,0,0.22)">
          <div style="width:22px;height:22px;border-radius:7px;box-sizing:border-box;border:1.5px solid rgba(255,255,255,0.45);background:{{r.box}};display:flex;align-items:center;justify-content:center;color:#1a1020">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{r.tick}}"><path d="m5 12 5 5 9-10"/></svg>
          </div>
          <div style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:18px;font-weight:500;color:#fff;background:linear-gradient(160deg,{{r.c1}},{{r.c2}})">{{r.letter}}</div>
          <div style="flex-grow:1;font-size:16px;font-weight:600">{{r.name}}</div>
          <span style="font-size:12px;font-weight:600;color:rgba(246,239,232,0.7)">{{r.src}}</span>
          <span style="padding:5px 12px;border-radius:12px;background:rgba(255,255,255,0.12);font-size:12px;font-weight:700">{{r.cat}}</span>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;gap:12px;height:62px;box-sizing:border-box;border-radius:20px;border:2px dashed rgba(255,255,255,0.3);font-size:14px;font-weight:600;color:rgba(246,239,232,0.85)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 20h14"/></svg>
      Glisse ici un .exe, un raccourci ou un lien
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:14px;font-weight:600;color:rgba(246,239,232,0.8)">3 sélectionnées</div>
      <div style="display:flex;gap:10px">
        <button style="border:0;border-radius:24px;padding:12px 22px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.14);color:#f6efe8">Annuler</button>
        <button style="border:0;border-radius:24px;padding:12px 26px;font-size:15px;font-weight:700;background:#ffb98a;color:#1a1020">Ajouter</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, letter, c1, c2, src, checked) => ({
      name, letter, c1: '#b98a9a', c2: '#3a2a3e', src, cat: 'Jeux',
      box: checked ? '#ffb98a' : 'rgba(0,0,0,0.25)', tick: checked ? 1 : 0
    });
    return {
      ghosts: [
        { c1: '#b98a9a', c2: '#2e2236' }, { c1: '#a87c9c', c2: '#2e2236' }, { c1: '#9a7aa8', c2: '#2e2236' },
        { c1: '#b0849c', c2: '#2e2236' }, { c1: '#a07a96', c2: '#2e2236' }
      ],
      rows: [
        row('Minecraft', 'M', '#5fc48a', '#143a2c', 'Menu Démarrer', true),
        row('Steam', 'S', '#7a8cff', '#2a2a66', 'Menu Démarrer', true),
        row('Epic Games', 'E', '#9a9eb4', '#2a2c3a', 'Menu Démarrer', false),
        row('[Jeu de la bibliothèque Steam]', 'J', '#d9607a', '#4a1a2e', 'Steam', true),
        row('[Jeu de la bibliothèque Epic]', 'J', '#4aa8e0', '#12304a', 'Epic', false)
      ]
    };
  }
}
</script>
</body>
</html>
