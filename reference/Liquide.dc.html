<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hub Liquide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.lg{position:relative;background:linear-gradient(135deg,rgba(255,255,255,0.2),rgba(255,255,255,0.05) 55%,rgba(255,255,255,0.12));backdrop-filter:blur(20px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.06);border:1px solid rgba(255,255,255,0.22);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.55),inset 0 -1.5px 0 rgba(255,255,255,0.12),inset 1.5px 0 0 rgba(255,255,255,0.18),inset -1.5px 0 0 rgba(255,255,255,0.08),0 18px 40px rgba(0,0,0,0.35),0 2px 6px rgba(0,0,0,0.25)}
.lg::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;background:radial-gradient(120% 95% at 18% 0%,rgba(255,255,255,0.3),rgba(255,255,255,0) 46%);pointer-events:none}
@keyframes fogA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(220px,-40px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes fogB{0%{transform:translate(0,0) scale(1.08)}50%{transform:translate(-240px,40px) scale(0.94)}100%{transform:translate(0,0) scale(1.08)}}
@keyframes fogC{0%{transform:translate(0,0)}50%{transform:translate(160px,-60px) scale(1.2)}100%{transform:translate(0,0)}}
@keyframes sway{0%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}100%{transform:rotate(-3deg)}}
@keyframes bandx{0%{left:-60%}55%{left:-60%}100%{left:140%}}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.85}85%{opacity:.5}100%{transform:translate(28px,-190px);opacity:0}}
.fogA{animation:fogA 26s ease-in-out infinite}
.fogB{animation:fogB 32s ease-in-out infinite}
.fogC{animation:fogC 38s ease-in-out infinite}
.beam{transform-origin:50% 0;animation:sway 12s ease-in-out infinite}
.band{animation:bandx 6s ease-in-out infinite}
.nav:hover{background:rgba(255,255,255,0.1)}
@media (prefers-reduced-motion:reduce){.fogA,.fogB,.fogC,.beam,.band{animation:none}.dust{animation:none!important}}
</style>
</helmet>
<div style="position:relative;overflow:hidden;width:1280px;height:760px;box-sizing:border-box;background:{{theme.bg}};color:#f6efe8;font-family:'DM Sans',system-ui,sans-serif">

  <div style="position:absolute;left:0;top:0;width:1280px;height:760px;opacity:{{atmo}}">
    <div class="fogA" style="position:absolute;left:-240px;top:300px;width:1000px;height:420px;border-radius:50%;background-color:{{cat.fa}};filter:blur(100px);transition:background-color .9s ease"></div>
    <div class="fogB" style="position:absolute;right:-260px;top:340px;width:1000px;height:400px;border-radius:50%;background-color:{{cat.fb}};filter:blur(110px);transition:background-color .9s ease"></div>
    <div class="fogC" style="position:absolute;left:220px;top:120px;width:760px;height:320px;border-radius:50%;background-color:{{cat.fc}};filter:blur(90px);transition:background-color .9s ease"></div>
    <sc-for list="{{beams}}" as="b" hint-placeholder-count="5">
      <div style="position:absolute;left:0;top:0;width:1280px;height:760px;opacity:{{b.o}};transition:opacity .9s ease;pointer-events:none">
        <div class="beam" style="position:absolute;left:{{b.left}}px;top:-300px;width:300px;height:1200px;background:linear-gradient(180deg,{{b.beam}},rgba(0,0,0,0) 74%);filter:blur(40px);mix-blend-mode:screen;transition:left .8s cubic-bezier(.2,.8,.2,1)"></div>
        <div style="position:absolute;left:{{b.poolLeft}}px;top:500px;width:420px;height:170px;border-radius:50%;background:{{b.pool}};filter:blur(34px);mix-blend-mode:screen;transition:left .8s cubic-bezier(.2,.8,.2,1)"></div>
      </div>
    </sc-for>
    <div style="position:absolute;left:0;bottom:0;width:1280px;height:220px;background:linear-gradient(0deg,rgba(176,120,230,0.3),rgba(176,120,230,0));filter:blur(14px)"></div>
    <sc-for list="{{dust}}" as="p" hint-placeholder-count="14">
      <div class="dust" style="position:absolute;left:{{p.x}}px;top:{{p.y}}px;width:{{p.s}}px;height:{{p.s}}px;border-radius:50%;background:#ffe6cc;box-shadow:0 0 10px rgba(255,210,160,0.9);opacity:0;animation:rise {{p.dur}}s ease-in-out {{p.d}}s infinite"></div>
    </sc-for>
  </div>

  <svg width="1280" height="760" viewBox="0 0 1280 760" style="position:absolute;left:0;top:0;opacity:0.1;mix-blend-mode:overlay;pointer-events:none" aria-hidden="true">
    <filter id="grainF"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="1280" height="760" filter="url(#grainF)"/>
  </svg>
  <div style="position:absolute;left:0;top:0;width:1280px;height:760px;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 48%,rgba(4,2,8,0.62) 100%)"></div>

  <div style="position:relative;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:24px 56px 24px;height:100%">

    <div class="lg" style="display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;height:58px;box-sizing:border-box;padding:0 12px 0 26px;border-radius:29px">
      <div style="font-family:'Fraunces',serif;font-size:26px;font-weight:500;letter-spacing:-0.01em">Hub</div>
      <div style="display:flex;align-items:center;gap:12px;width:400px;height:38px;box-sizing:border-box;padding:0 16px;border-radius:19px;background:rgba(0,0,0,0.22);box-shadow:inset 0 1px 3px rgba(0,0,0,0.35);color:rgba(246,239,232,0.75);font-size:14px;font-weight:500">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span style="flex-grow:1">Rechercher une app ou une scène</span>
        <span style="font-size:12px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,0.12)">Ctrl K</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="display:flex;padding:3px;border-radius:19px;background:rgba(0,0,0,0.22);font-size:13px;font-weight:600">
          <span style="padding:7px 14px;border-radius:16px;background:rgba(255,255,255,0.22)">Immersif</span>
          <span style="padding:7px 14px;color:rgba(246,239,232,0.75)">Fenêtre</span>
          <span style="padding:7px 14px;color:rgba(246,239,232,0.75)">Widget</span>
        </div>
        <button aria-label="Commande vocale" style="width:38px;height:38px;border-radius:19px;border:0;background:rgba(255,255,255,0.14);color:#f6efe8;display:flex;align-items:center;justify-content:center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button aria-label="Contrôle par les mains" style="width:38px;height:38px;border-radius:19px;border:0;background:rgba(255,255,255,0.14);color:#f6efe8;display:flex;align-items:center;justify-content:center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V6a1.5 1.5 0 0 1 3 0v5m0-1V4.5a1.5 1.5 0 0 1 3 0V11m0-4.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 7-6 7-2.5 0-4-1.2-5.5-3.5L4 14.5a1.5 1.5 0 0 1 2.5-1.5L8 15"/></svg>
        </button>
      </div>
    </div>

    <div style="margin-top:8px;display:flex;flex-direction:column;align-items:center">
      <div style="font-size:13px;font-weight:600;letter-spacing:0.22em;color:{{cat.accent}};transition:color .8s">CATÉGORIE</div>
      <h1 style="margin:0;font-family:'Fraunces',serif;font-size:92px;line-height:1.05;font-weight:300;letter-spacing:-0.03em;text-shadow:0 0 70px {{cat.glow}}">{{cat.name}}</h1>
    </div>

    <div style="margin-top:6px;display:flex;align-items:center;justify-content:center;gap:20px;height:340px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.pick}}" aria-label="{{c.name}}" style="position:relative;overflow:hidden;box-sizing:border-box;width:{{c.w}}px;height:{{c.h}}px;padding:18px;border-radius:26px;text-align:left;color:#fff;opacity:{{c.o}};background:radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,0.3),rgba(255,255,255,0) 52%),linear-gradient(170deg,{{c.c1}},{{c.c2}});border:1px solid rgba(255,255,255,0.22);box-shadow:{{c.shadow}};display:flex;flex-direction:column;justify-content:space-between;transition:width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),opacity .6s ease,box-shadow .6s ease">
          <div style="position:absolute;left:0;top:0;right:0;bottom:0;border-radius:26px;overflow:hidden;opacity:{{c.shine}};transition:opacity .6s ease;pointer-events:none">
            <div class="band" style="position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,0.3),rgba(255,255,255,0));transform:skewX(-14deg)"></div>
          </div>
          <div style="position:relative;font-family:'Fraunces',serif;font-size:{{c.fs}}px;font-weight:300;line-height:1;color:rgba(255,255,255,0.94);transition:font-size .6s cubic-bezier(.2,.8,.2,1)">{{c.letter}}</div>
          <div class="lg" style="padding:10px 14px;border-radius:16px;font-size:16px;font-weight:600;letter-spacing:-0.01em">{{c.name}}</div>
        </button>
      </sc-for>
    </div>

    <div style="flex-grow:1"></div>

    <div class="lg" style="display:flex;align-items:center;gap:4px;padding:6px;border-radius:28px;font-size:15px;font-weight:600">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
        <button onClick="{{tb.pick}}" style="border:0;border-radius:22px;padding:10px 22px;font-size:15px;font-weight:600;background:{{tb.bg}};color:{{tb.color}};transition:background .4s ease,color .4s ease">{{tb.label}}</button>
      </sc-for>
    </div>

    <div class="lg" style="margin-top:14px;display:flex;align-items:center;gap:8px;padding:8px;border-radius:36px">
      <button style="border:0;border-radius:28px;padding:13px 26px;font-size:15px;font-weight:700;background:{{cat.accent}};color:#1a1020;transition:background .8s ease">Soirée gaming</button>
      <button style="border:0;border-radius:28px;padding:13px 22px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.14);color:#f6efe8">Stream</button>
      <button style="border:0;border-radius:28px;padding:13px 22px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.14);color:#f6efe8">Créa</button>
      <div style="width:1px;height:26px;background:rgba(255,255,255,0.22);margin:0 4px"></div>
      <button aria-label="Commande vocale" style="width:46px;height:46px;border-radius:23px;border:0;background:rgba(255,255,255,0.14);color:#f6efe8;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"crepuscule","options":["crepuscule","boreale","ocean","rose","graphite"],"section":"Thème"},"gameColors":{"editor":"enum","default":"leger","options":["off","leger","immersif"],"section":"Thème"},"intensity":{"editor":"range","default":1,"min":0.3,"max":1,"step":0.05,"section":"Atmosphère"},"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const catI = st.cat ?? 0;
    const focus = st.focus ?? 2;
    const cats = [
      { name: 'Jeux', accent: '#ffb98a', glow: 'rgba(255,170,120,0.35)', fa: 'rgba(160,104,214,0.42)', fb: 'rgba(255,150,100,0.3)', fc: 'rgba(255,205,170,0.14)',
        apps: [['Riot Client','R',217,96,122],['Minecraft','M',95,196,138],['Steam','S',122,140,255],['Epic Games','E',154,158,180],['Battle.net','B',74,168,224]] },
      { name: 'Stream', accent: '#7fd0ff', glow: 'rgba(100,180,255,0.35)', fa: 'rgba(60,120,220,0.42)', fb: 'rgba(60,200,200,0.3)', fc: 'rgba(170,220,255,0.14)',
        apps: [['Streamlabs','S',90,200,190],['Twitch','T',150,100,255],['OBS Studio','O',150,160,190],['Discord','D',120,130,255],['Spotify','S',90,210,130]] },
      { name: 'Créativité', accent: '#ff9ad0', glow: 'rgba(255,130,200,0.35)', fa: 'rgba(220,90,170,0.42)', fb: 'rgba(255,170,90,0.3)', fc: 'rgba(255,190,225,0.14)',
        apps: [['Krita','K',240,120,170],['DaVinci Resolve','D',120,150,230],['Blender','B',255,160,70],['Figma','F',170,110,250],['Ableton Live','A',90,200,210]] },
      { name: 'Logiciels', accent: '#8fe3b8', glow: 'rgba(110,225,170,0.35)', fa: 'rgba(60,190,140,0.4)', fb: 'rgba(90,150,220,0.3)', fc: 'rgba(190,255,225,0.12)',
        apps: [['Terminal','T',140,150,170],['Firefox','F',255,140,80],['VS Code','V',80,160,240],['Notion','N',200,200,210],['7-Zip','7',100,190,120]] },
      { name: 'Autre', accent: '#ffe08a', glow: 'rgba(255,225,140,0.3)', fa: 'rgba(190,160,100,0.38)', fb: 'rgba(150,130,200,0.3)', fc: 'rgba(255,240,200,0.13)',
        apps: [['Photos','P',230,120,160],['Bloc-notes','B',210,190,110],['Paramètres','P',140,150,170],['Calculatrice','C',120,170,220],['Musique','M',240,100,110]] }
    ];
    const themes = {
      crepuscule: { bg: 'linear-gradient(180deg,#171021 0%,#0f0a16 55%,#09060d 100%)', accent: '#ffb98a', glow: 'rgba(255,170,120,0.35)', fa: 'rgba(160,104,214,0.42)', fb: 'rgba(255,150,100,0.3)', fc: 'rgba(255,205,170,0.14)', card: [190, 120, 170], beam: [255, 190, 140] },
      boreale: { bg: 'linear-gradient(180deg,#0e1a1a 0%,#0a1214 55%,#060b0c 100%)', accent: '#8fe3b8', glow: 'rgba(110,225,170,0.35)', fa: 'rgba(60,190,160,0.4)', fb: 'rgba(90,150,230,0.28)', fc: 'rgba(190,255,225,0.12)', card: [90, 190, 170], beam: [140, 235, 200] },
      ocean: { bg: 'linear-gradient(180deg,#0e1626 0%,#0a101c 55%,#060a12 100%)', accent: '#7fd0ff', glow: 'rgba(100,180,255,0.35)', fa: 'rgba(60,120,220,0.42)', fb: 'rgba(60,190,210,0.28)', fc: 'rgba(170,220,255,0.13)', card: [90, 150, 225], beam: [140, 200, 255] },
      rose: { bg: 'linear-gradient(180deg,#1f1020 0%,#150a18 55%,#0b060d 100%)', accent: '#ff9ad0', glow: 'rgba(255,130,200,0.35)', fa: 'rgba(220,90,170,0.4)', fb: 'rgba(255,150,170,0.3)', fc: 'rgba(255,190,225,0.14)', card: [225, 120, 175], beam: [255, 170, 210] },
      graphite: { bg: 'linear-gradient(180deg,#16161a 0%,#0f0f12 55%,#08080a 100%)', accent: '#e8e4de', glow: 'rgba(230,226,220,0.25)', fa: 'rgba(120,120,140,0.35)', fb: 'rgba(160,150,140,0.22)', fc: 'rgba(255,255,255,0.08)', card: [150, 150, 165], beam: [220, 220, 235] }
    };
    const th = themes[this.props.theme] || themes.crepuscule;
    const gmode = this.props.gameColors ?? 'leger';
    const catBase = cats[catI];
    const fRgb = catBase.apps[focus].slice(2, 5);
    const tint = (c, al) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + al + ')';
    const cat = Object.assign({}, catBase, {
      accent: th.accent, glow: th.glow,
      fa: gmode === 'immersif' ? tint(fRgb, 0.42) : th.fa,
      fb: gmode === 'immersif' ? tint(fRgb, 0.3) : th.fb,
      fc: gmode === 'off' ? th.fc : tint(fRgb, 0.2)
    });
    const W = (i) => (i === focus ? 232 : 172);
    const gap = 20;
    let total = gap * 4;
    for (let i = 0; i < 5; i++) total += W(i);
    let x = (1280 - total) / 2;
    const centers = [];
    for (let i = 0; i < 5; i++) { centers.push(x + W(i) / 2); x += W(i) + gap; }
    const rgba = (r, g, b, a) => 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    const edge = 'inset 0 1.5px 0 rgba(255,255,255,0.5),inset 0 -1px 0 rgba(255,255,255,0.12),inset 1px 0 0 rgba(255,255,255,0.18)';
    const cards = cat.apps.map((a, i) => {
      const f = i === focus;
      let r = a[2], g = a[3], b = a[4];
      if (!(gmode === 'immersif' && i === focus)) {
        const k = [0.9, 1, 1.1, 0.95, 1.05][i];
        r = Math.min(255, Math.round(th.card[0] * k));
        g = Math.min(255, Math.round(th.card[1] * k));
        b = Math.min(255, Math.round(th.card[2] * k));
      }
      return {
        name: a[0], letter: a[1], w: W(i), h: f ? 324 : 246, o: f ? 1 : 0.62, fs: f ? 100 : 64,
        c1: 'rgb(' + r + ',' + g + ',' + b + ')',
        c2: 'rgb(' + Math.floor(r * 0.22) + ',' + Math.floor(g * 0.22) + ',' + Math.floor(b * 0.3) + ')',
        shine: f ? 1 : 0,
        shadow: f ? edge + ',0 30px 80px ' + rgba(r, g, b, 0.4) : edge + ',0 12px 30px rgba(0,0,0,0.3)',
        pick: () => this.setState({ focus: i })
      };
    });
    const beams = cat.apps.map((a, i) => ({
      o: i === focus ? 1 : 0,
      left: Math.round(centers[i] - 150),
      poolLeft: Math.round(centers[i] - 210),
      beam: rgba(...(gmode !== 'off' ? [a[2], a[3], a[4]] : th.beam), 0.55),
      pool: 'radial-gradient(ellipse at center,' + rgba(...(gmode !== 'off' ? [a[2], a[3], a[4]] : th.beam), 0.6) + ',rgba(0,0,0,0) 70%)'
    }));
    const tabs = cats.map((c, i) => ({
      label: c.name,
      pick: () => this.setState({ cat: i, focus: 2 }),
      bg: i === catI ? 'rgba(255,255,255,0.24)' : 'transparent',
      color: i === catI ? '#ffffff' : 'rgba(246,239,232,0.78)'
    }));
    const dust = [];
    for (let i = 0; i < 14; i++) {
      const a = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
      const b = Math.abs(Math.sin(i * 78.233) * 12543.123) % 1;
      const c = Math.abs(Math.sin(i * 39.346) * 9871.77) % 1;
      dust.push({ x: Math.round(60 + a * 1160), y: Math.round(380 + b * 360), s: (2 + c * 3).toFixed(1), dur: (10 + a * 9).toFixed(1), d: (-(b * 14)).toFixed(1) });
    }
    return { atmo: this.props.intensity ?? 1, theme: { bg: th.bg }, cat, cards, beams, tabs, dust };
  }
}
</script>
</body>
</html>
