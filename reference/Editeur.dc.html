<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hub Éditeur de scène</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.lg{position:relative;background:linear-gradient(135deg,rgba(255,255,255,0.2),rgba(255,255,255,0.05) 55%,rgba(255,255,255,0.12));backdrop-filter:blur(20px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.06);border:1px solid rgba(255,255,255,0.22);box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.55),inset 0 -1.5px 0 rgba(255,255,255,0.12),inset 1.5px 0 0 rgba(255,255,255,0.18),inset -1.5px 0 0 rgba(255,255,255,0.08),0 18px 40px rgba(0,0,0,0.35),0 2px 6px rgba(0,0,0,0.25)}
.lg::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;border-radius:inherit;background:radial-gradient(120% 95% at 18% 0%,rgba(255,255,255,0.3),rgba(255,255,255,0) 46%);pointer-events:none}
@keyframes fogA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(200px,-40px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes fogB{0%{transform:translate(0,0) scale(1.08)}50%{transform:translate(-220px,40px) scale(0.94)}100%{transform:translate(0,0) scale(1.08)}}
.fogA{animation:fogA 26s ease-in-out infinite}
.fogB{animation:fogB 32s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.fogA,.fogB{animation:none}}
</style>
</helmet>
<div style="position:relative;overflow:hidden;width:1280px;height:760px;box-sizing:border-box;background:linear-gradient(180deg,#171021 0%,#0f0a16 55%,#09060d 100%);color:#f6efe8;font-family:'DM Sans',system-ui,sans-serif">
  <div class="fogA" style="position:absolute;left:-240px;top:320px;width:1000px;height:420px;border-radius:50%;background:rgba(160,104,214,0.4);filter:blur(100px)"></div>
  <div class="fogB" style="position:absolute;right:-260px;top:-60px;width:900px;height:420px;border-radius:50%;background:rgba(255,150,100,0.26);filter:blur(110px)"></div>
  <svg width="1280" height="760" viewBox="0 0 1280 760" style="position:absolute;left:0;top:0;opacity:0.1;mix-blend-mode:overlay;pointer-events:none" aria-hidden="true">
    <filter id="grainG"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="1280" height="760" filter="url(#grainG)"/>
  </svg>

  <div style="position:relative;display:flex;flex-direction:column;gap:20px;box-sizing:border-box;padding:28px 48px;height:100%">

    <div class="lg" style="display:flex;align-items:center;gap:16px;height:64px;box-sizing:border-box;padding:0 14px 0 14px;border-radius:32px">
      <button style="display:flex;align-items:center;gap:8px;border:0;border-radius:22px;padding:11px 18px;font-size:14px;font-weight:600;background:rgba(255,255,255,0.14);color:#f6efe8">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Scènes
      </button>
      <div style="font-family:'Fraunces',serif;font-size:30px;font-weight:500;letter-spacing:-0.01em">Soirée gaming</div>
      <span style="padding:6px 12px;border-radius:12px;background:rgba(0,0,0,0.25);font-size:13px;font-weight:600;color:rgba(246,239,232,0.8)">Ctrl + Alt + 1</span>
      <div style="flex-grow:1"></div>
      <button style="display:flex;align-items:center;gap:8px;border:0;border-radius:24px;padding:13px 22px;font-size:15px;font-weight:600;background:rgba(255,255,255,0.14);color:#f6efe8">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>Tester
      </button>
      <button style="border:0;border-radius:24px;padding:13px 24px;font-size:15px;font-weight:700;background:#ffb98a;color:#1a1020">Enregistrer</button>
    </div>

    <div style="display:flex;gap:24px;flex-grow:1;min-height:0">

      <div style="display:flex;flex-direction:column;gap:14px;flex-grow:1;min-width:0">
        <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;color:rgba(246,239,232,0.7)">ÉTAPES · 5</div>
        <div style="position:relative;display:flex;flex-direction:column;gap:12px">
          <div style="position:absolute;left:35px;top:30px;bottom:30px;width:2px;background:rgba(255,255,255,0.16)"></div>
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
            <div class="lg" style="display:flex;align-items:center;gap:14px;height:72px;box-sizing:border-box;padding:0 18px;border-radius:22px">
              <div style="width:34px;height:34px;flex-shrink:0;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:rgba(0,0,0,0.3)">{{s.n}}</div>
              <span style="flex-shrink:0;padding:5px 11px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:0.1em;background:{{s.bg}};color:{{s.fg}}">{{s.kind}}</span>
              <div style="display:flex;flex-direction:column;gap:2px;min-width:0;flex-grow:1">
                <div style="font-size:17px;font-weight:600;letter-spacing:-0.01em">{{s.title}}</div>
                <div style="font-size:13px;font-weight:500;color:rgba(246,239,232,0.7)">{{s.sub}}</div>
              </div>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(246,239,232,0.6)" stroke-width="2" stroke-linecap="round"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"/></svg>
            </div>
          </sc-for>
          <button style="display:flex;align-items:center;justify-content:center;gap:10px;height:56px;box-sizing:border-box;border-radius:22px;border:2px dashed rgba(255,255,255,0.28);background:transparent;color:rgba(246,239,232,0.85);font-size:15px;font-weight:600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter une étape
          </button>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;width:380px;flex-shrink:0">
        <div class="lg" style="display:flex;flex-direction:column;gap:10px;box-sizing:border-box;padding:20px;border-radius:26px">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;color:rgba(246,239,232,0.7)">AJOUTER UNE ACTION</div>
          <sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:14px;background:rgba(0,0,0,0.22);font-size:15px;font-weight:600;opacity:{{a.o}}">
              <span>{{a.label}}</span>
              <span style="font-size:11px;font-weight:700;letter-spacing:0.08em;color:rgba(246,239,232,0.7)">{{a.tag}}</span>
            </div>
          </sc-for>
        </div>
        <div class="lg" style="display:flex;flex-direction:column;gap:10px;box-sizing:border-box;padding:20px;border-radius:26px">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;color:rgba(246,239,232,0.7)">EMPLACEMENTS DE LA SCÈNE</div>
          <sc-for list="{{slots}}" as="p" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,0.22);font-size:14px;font-weight:600">
              <span style="color:rgba(246,239,232,0.75)">{{p.slot}}</span>
              <span style="display:flex;align-items:center;gap:8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>{{p.app}}</span>
            </div>
          </sc-for>
          <div style="font-size:12px;font-weight:500;line-height:1.45;color:rgba(246,239,232,0.7)">Seuls les noms d'emplacements sont partagés quand tu exportes la scène, jamais les chemins ni les commandes.</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const go = { bg: 'rgba(255,185,138,0.22)', fg: '#ffd2b0' };
    const wait = { bg: 'rgba(255,255,255,0.16)', fg: '#f6efe8' };
    return {
      steps: [
        { n: 1, kind: 'LANCER', title: 'Messagerie', sub: 'Emplacement relié à Discord', ...go },
        { n: 2, kind: 'ATTENDRE', title: '2 secondes', sub: 'Délai fixe', ...wait },
        { n: 3, kind: 'LANCER', title: 'Plateforme de jeux', sub: 'Emplacement relié à Steam', ...go },
        { n: 4, kind: 'ATTENDRE', title: 'Que Steam soit prêt', sub: 'Surveille le processus, 30 s maximum', ...wait },
        { n: 5, kind: 'LANCER', title: 'Musique', sub: 'Emplacement relié à Spotify', ...go }
      ],
      actions: [
        { label: 'Lancer une app', tag: '', o: 1 },
        { label: 'Attendre un délai', tag: '', o: 1 },
        { label: 'Attendre un processus', tag: '', o: 1 },
        { label: 'Mettre au premier plan', tag: '', o: 1 },
        { label: 'Fermer en douceur', tag: 'AVEC CONFIRMATION', o: 1 },
        { label: 'OBS, lumières, Discord', tag: 'BIENTÔT', o: 0.5 }
      ],
      slots: [
        { slot: 'Messagerie', app: 'Discord' },
        { slot: 'Plateforme de jeux', app: 'Steam' },
        { slot: 'Musique', app: 'Spotify' }
      ]
    };
  }
}
</script>
</body>
</html>
