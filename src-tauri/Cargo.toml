[package]
name = "hub"
version = "0.2.0"
description = "Hub — application launcher"
edition = "2021"
rust-version = "1.90"

[lib]
name = "hub_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
