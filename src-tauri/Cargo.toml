[package]
name = "hub"
version = "0.2.0"
description = "Kayro — application launcher"
edition = "2021"
default-run = "Kayro"
rust-version = "1.90"

[lib]
name = "hub_lib"
crate-type = ["rlib"]

# The executable is named after the product; the crate stays `hub`.
[[bin]]
name = "Kayro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
keyvalues-parser = "0.2.4"
png = "0.18.1"
# Decodes the posters for the game colours (step 14): JPEG (Steam) and PNG only, pure Rust.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
