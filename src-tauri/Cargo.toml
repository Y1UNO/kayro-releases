[package]
name = "hub"
version = "0.20.6"
description = "Kayro — application launcher"
edition = "2021"
default-run = "Kayro"
rust-version = "1.90"

[lib]
name = "hub_lib"
crate-type = ["rlib"]

# The executable is named after the product; the crate stays `hub`.
[[bin]]
name = "Kayro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-autostart = "2.7.0"
# Step 18b, updates: signed releases checked against the key built into Kayro.
tauri-plugin-updater = "=2.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
kayro-startup = { path = "../crates/startup" }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
keyvalues-parser = "0.2.4"
png = "0.18.1"
# Decodes the posters for the game colours (step 14): JPEG (Steam), PNG and WebP, pure Rust.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# « Exporter les logs »: deflate only, through flate2/zlib-rs already in the tree.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
# Step 21, the voice: speech detection, the wake word and the French transcription, all on the PC
# (k2-fsa, Apache-2.0; static, its own ONNX Runtime inside; libraries: scripts/fetch-ai.ps1).
sherpa-onnx = "=2.0.1"
# Step 21: the echo of the speakers taken out of the microphone (WebRTC AEC3, pure Rust).
aec3 = { version = "=0.4.0", default-features = false }
# Its models, downloaded on demand (voice/models.rs): the HTTP client, TLS and SHA-256 the updater
# already brings (same versions, no new crate).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_Packaging_Appx", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Foundation", "Media_Control", "Storage_Streams", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Media_SpeechSynthesis", "Media_Core", "Win32_Media_Audio_Endpoints", "Win32_System_Shutdown", "Win32_Media_MediaFoundation"] }

[dev-dependencies]
tempfile = "3"
