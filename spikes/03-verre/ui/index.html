<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Spike 03</title>
    <style>
      html, body { margin: 0; height: 100%; background: #171021; overflow: hidden; font-family: system-ui, sans-serif; color: #f1e9f7; }
      .mist { position: fixed; width: 1400px; height: 1400px; border-radius: 50%; will-change: transform; }
      .m1 { left: -200px; top: -300px; background: radial-gradient(closest-side, rgba(150,90,255,.55), transparent); animation: d1 24s linear infinite alternate; }
      .m2 { left: 900px; top: 200px; background: radial-gradient(closest-side, rgba(255,120,160,.45), transparent); animation: d2 31s linear infinite alternate; }
      .m3 { left: 400px; top: 700px; background: radial-gradient(closest-side, rgba(80,200,255,.40), transparent); animation: d3 27s linear infinite alternate; }
      @keyframes d1 { to { transform: translate(900px, 500px) scale(1.2); } }
      @keyframes d2 { to { transform: translate(-800px, 300px) scale(.9); } }
      @keyframes d3 { to { transform: translate(700px, -600px) scale(1.1); } }
      body.paused .mist { animation-play-state: paused; }
      #canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
      .glass { position: fixed; width: 460px; height: 300px; border-radius: 28px; padding: 24px; box-sizing: border-box;
               background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
               backdrop-filter: blur(20px) saturate(190%); -webkit-backdrop-filter: blur(20px) saturate(190%); }
      #hud { position: fixed; left: 12px; bottom: 8px; font: 14px Consolas, monospace; z-index: 10; }
    </style>
  </head>
  <body>
    <div class="mist m1"></div><div class="mist m2"></div><div class="mist m3"></div>
    <canvas id="canvas"></canvas>
    <div id="surfaces"></div>
    <div id="hud"></div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const rec = (o) => invoke('report', { json: JSON.stringify(o) });
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.ceil(p * s.length) - 1)]; };
      const hud = document.getElementById('hud');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = innerWidth; canvas.height = innerHeight;
      const parts = Array.from({ length: 26 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: 2 + Math.random() * 4, vx: (Math.random() - .5) * 40, vy: (Math.random() - .5) * 40 }));
      let canvasOn = false, last = 0;

      // Always-running loop: draws the particles when enabled; its timestamps are the frame deltas.
      let sink = null;
      function frame(t) {
        const dt = (t - last) / 1000; last = t;
        if (canvasOn) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = 'rgba(255,255,255,.55)';
          for (const p of parts) {
            p.x = (p.x + p.vx * dt + canvas.width) % canvas.width; p.y = (p.y + p.vy * dt + canvas.height) % canvas.height;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
          }
        }
        if (sink) sink.push(t);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      function setSurfaces(n) {
        const host = document.getElementById('surfaces'); host.innerHTML = '';
        for (let i = 0; i < n; i++) {
          const d = document.createElement('div'); d.className = 'glass';
          d.style.left = (140 + (i % 3) * 700) + 'px'; d.style.top = (220 + Math.floor(i / 3) * 520) + 'px';
          d.textContent = 'Surface verre ' + (i + 1);
          host.appendChild(d);
        }
      }

      async function measure(label, surfaces, withCanvas, ms, paused = false) {
        document.body.classList.toggle("paused", paused);
        setSurfaces(surfaces); canvasOn = withCanvas; if (!withCanvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
        hud.textContent = `${label} — chauffe…`; await wait(2500);
        const stamps = []; sink = stamps; const t0 = Date.now(); hud.textContent = `${label} — mesure ${ms / 1000}s`;
        await wait(ms); sink = null; const t1 = Date.now();
        const d = stamps.slice(1).map((t, i) => t - stamps[i]);
        const med = q(d, .5);
        await rec({ kind: 'step', label, surfaces, canvas: withCanvas, start: t0, end: t1, n: d.length, hz_est: 1000 / med,
          p50: med, p95: q(d, .95), p99: q(d, .99), max: Math.max(...d),
          dropped_vs_median: d.filter((x) => x > 1.5 * med).length, dropped_vs_279hz: d.filter((x) => x > 1.5 * 3.584).length });
      }

      (async () => {
        await rec({ kind: 'env', dpr: devicePixelRatio, w: innerWidth, h: innerHeight, ua: navigator.userAgent });
        await wait(1500);
        await measure("paused-baseline", 0, false, 10000, true);
        for (const [s, c] of [[0, false], [0, true], [3, false], [3, true], [6, false], [6, true]])
          await measure(`${s}surf${c ? '+canvas' : ''}`, s, c, 10000);
        await rec({ kind: 'done' });
        await wait(500); invoke('finish');
      })();
    </script>
  </body>
</html>
