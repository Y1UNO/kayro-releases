<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Spike 01</title>
    <style>
      html, body { margin: 0; height: 100%; background: #171021; color: #f1e9f7; font-family: system-ui, sans-serif; }
      main { padding: 24px; }
      #log { font: 12px/1.5 Consolas, monospace; white-space: pre; opacity: .8; }
    </style>
  </head>
  <body>
    <main><h1>Spike 01 — affichage par raccourci</h1><div id="log"></div></main>
    <script>
      const { invoke } = window.__TAURI__.core;
      const log = (m) => { document.getElementById('log').textContent += m + '\n'; invoke('js_log', { msg: m }); };
      let armed = false;
      function onShown(source) {
        if (armed) return;
        armed = true;
        // Two rAF = the frame containing the visible state has been produced.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          invoke('mark_painted', { source, focused: document.hasFocus(), visibility: document.visibilityState });
        }));
      }
      document.addEventListener('visibilitychange', () => {
        log('visibilitychange -> ' + document.visibilityState);
        if (document.visibilityState === 'visible') onShown('visibilitychange'); else armed = false;
      });
      window.addEventListener('focus', () => { log('window focus'); onShown('focus'); });
      window.addEventListener('blur', () => { log('window blur'); armed = false; });
      window.addEventListener('keydown', (e) => { invoke('mark_key', { key: e.key }); });
      // Rust emits "shown" right after show(): fallback signal if the page never sees a visibility change.
      window.__TAURI__.event.listen('shown', () => {
        if (hiddenSince !== null) { invoke('js_log', { msg: 'hidden_stats ' + JSON.stringify({ hidden_ms: Math.round(performance.now() - hiddenSince), raf_frames_while_hidden: hiddenFrames }) }); hiddenSince = null; }
        onShown('event');
      });
      window.__TAURI__.event.listen('hidden', () => { armed = false; hiddenSince = performance.now(); hiddenFrames = 0; });
      let hiddenSince = null, hiddenFrames = 0;
      (function tick() { if (hiddenSince !== null) hiddenFrames++; requestAnimationFrame(tick); })();
      log('page loaded, visibility=' + document.visibilityState);
    </script>
  </body>
</html>
