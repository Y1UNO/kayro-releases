<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Spike 02</title>
    <style>
      :root { --surface: rgba(30, 20, 38, 0.82); }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: system-ui, sans-serif; color: #f1e9f7; }
      body.acrylic, body.mica { --surface: rgba(30, 20, 38, 0.30); }
      .shell { position: fixed; inset: 0; background: var(--surface); border-radius: 32px; border: 1px solid rgba(255,255,255,.12); box-sizing: border-box; }
      .bar { height: 64px; display: flex; align-items: center; padding: 0 28px; gap: 16px; }
      .panel { padding: 0 28px; opacity: 0; transition: opacity .15s; }
      body.open .panel { opacity: 1; }
      body.open .shell { border-radius: 28px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #c9a7ff; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="bar"><span class="dot"></span><strong id="label">widget</strong></div>
      <div class="panel">Panneau déplié — recherche, scènes, en cours, récents…</div>
    </div>
    <script>
      const { invoke } = window.__TAURI__.core;
      const rec = (kind, data) => invoke('report', { json: JSON.stringify({ kind, ...data }) });
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const raf = () => new Promise((r) => requestAnimationFrame(r));
      const q = (a, p) => { const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.ceil(p * s.length) - 1)]; };

      document.addEventListener('mousedown', (e) => rec('mousedown', { x: e.clientX, y: e.clientY }));

      async function setOpen(open) {
        const t0 = performance.now();
        document.body.classList.toggle('open', open);
        const rustMs = await invoke('set_height', { h: open ? 304 : 64 });
        await raf(); await raf();
        await rec('resize', { open, rust_set_size_ms: rustMs, until_2_frames_ms: performance.now() - t0 });
      }

      async function frameStats(label, ms) {
        const deltas = []; let last = performance.now(); const end = last + ms;
        while (last < end) { const t = await new Promise(requestAnimationFrame); deltas.push(t - last); last = t; }
        deltas.shift();
        await rec('frames', { label, n: deltas.length, p50: q(deltas, .5), p95: q(deltas, .95), max: Math.max(...deltas), over_1p5x_median: deltas.filter((d) => d > 1.5 * q(deltas, .5)).length });
      }

      (async () => {
        const variant = await invoke('get_variant');
        document.body.classList.add(variant);
        document.getElementById('label').textContent = 'variante : ' + variant;
        await wait(1500); await invoke('stage', { name: 'idle' });
        await wait(1200);
        for (let i = 0; i < 3; i++) {
          await setOpen(true); await wait(700);
          if (i === 2) await invoke('stage', { name: 'expanded' });
          await wait(500); await setOpen(false); await wait(500);
        }
        await invoke('stage', { name: 'collapsed' });
        await wait(500);
        const moving = invoke('move_test');           // ~1.5 s programmatic window drag
        await frameStats('during_move', 1500);
        await moving;
        await frameStats('idle_after', 1500);
        await invoke('stage', { name: 'probe' });     // harness probes WindowFromPoint at a transparent corner
        await wait(2500);
        await invoke('stage', { name: 'done' });
      })();
    </script>
  </body>
</html>
