[package]
name = "kayro-startup"
version = "0.0.0"
description = "Kayro — apps lancées avec Windows (StartupApproved)"
edition = "2021"
publish = false
rust-version = "1.90"

# Shared by Kayro (Réglages › Démarrage) and its installer (« Au démarrage du PC »), step 19.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
